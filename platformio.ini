; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[env]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
; This ST-Link probe's firmware only supports the deprecated HLA transport
; (would need a firmware update via STM32CubeProgrammer to use the default
; interface/stlink.cfg), so upload is wired directly to openocd with
; interface/stlink-hla.cfg instead of upload_protocol = stlink.
upload_protocol = custom
upload_command = /home/javierih/.platformio/packages/tool-openocd/bin/openocd -s /home/javierih/.platformio/packages/tool-openocd/openocd/scripts -f interface/stlink-hla.cfg -f target/stm32f1x.cfg -c "reset_config none" -c "program $BUILD_DIR/firmware.elf verify reset exit"
debug_tool = stlink

; Real robot firmware (main.c)
[env:bluepill_f103c8]
build_src_filter = +<*> -<test_uart.c> -<test_diag.c> -<test_maze.c> -<test_flood.c>
build_flags = -DPRACTICE_MAZE=1

; Standalone UART smoke test (test_uart.c), motors/encoders/IR untouched
[env:uart_test]
build_src_filter = +<*> -<main.c> -<test_diag.c> -<test_maze.c> -<test_flood.c>

; LED + IR live test panel (test_diag.c), no motor/encoder code included
[env:diag_test]
build_src_filter = +<*> -<main.c> -<test_uart.c> -<test_maze.c> -<test_flood.c>

; Maze wall-sensing test (test_maze.c): validate wall detection before the real maze arrives
[env:maze_test]
build_src_filter = +<*> -<main.c> -<test_uart.c> -<test_diag.c> -<test_flood.c>

; Flood fill logic test (test_flood.c): pure algorithm check, no sensors/motors needed
[env:flood_test]
build_src_filter = +<*> -<main.c> -<test_uart.c> -<test_diag.c> -<test_maze.c>

; PlatformIO Project Configuration File
; http://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` / `pio run -t upload` without -e act on the robot firmware only
; (otherwise every environment would be flashed in turn, the last one winning).
default_envs = bluepill_f103c8

[env]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
board_build.stm32cube.custom_config_header = yes
; The last 1 KB flash page holds the saved maze (flash_store.c): the build
; fails if the program would ever grow into it.
board_upload.maximum_size = 64512
build_src_flags = -Wall -Wextra -Wshadow -Wdouble-promotion
; This ST-Link probe's firmware only supports the deprecated HLA transport
; (would need a firmware update via STM32CubeProgrammer to use the default
; interface/stlink.cfg), so upload is wired directly to openocd with
; interface/stlink-hla.cfg instead of upload_protocol = stlink.
upload_protocol = custom
upload_command = $PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd -s $PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts -f interface/stlink-hla.cfg -f target/stm32f1x.cfg -c "reset_config none" -c "program $BUILD_DIR/firmware.elf verify reset exit"
debug_tool = stlink

[common]
; Robot application modules: the hardware test firmwares leave them out.
app_sources = -<main.c> -<motion.c> -<search.c> -<commands.c> -<storage.c> -<flash_store.c> -<params.c> -<maze.c> -<crc32.c>

; Robot firmware (main.c). PRACTICE_MAZE=1: 4x3 practice maze, goal (3,2).
; Remove it (or use the GOAL command) for a 16x16 competition maze.
[env:bluepill_f103c8]
build_src_filter = +<*> -<test_*.c>
build_flags = -DPRACTICE_MAZE=1

; UART/Bluetooth smoke test (test_uart.c): motors, encoders and IR untouched
[env:uart_test]
build_src_filter = +<*> ${common.app_sources} -<test_*.c> +<test_uart.c>

; LED + IR + encoder live panel for tools/dashboard.py (test_diag.c), motors never driven
[env:diag_test]
build_src_filter = +<*> ${common.app_sources} -<test_*.c> +<test_diag.c>
